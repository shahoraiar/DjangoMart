{% extends "base.html" %}

{% block navbar %}

<section class="section-conten padding-y" style="min-height:84vh">
  <div class="mx-auto" style="max-width: 380px; margin-top:100px;">

    {% if error %}
    <div class="alert alert-danger mb-3" role="alert">
      <strong>Request failed.</strong> {{ error }}
    </div>
    {% endif %}

    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-2 text-center">Forgot password</h4>
        <p class="text-muted text-center small mb-4">Enter your account email. We will send a 5-minute OTP.</p>
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
          </div>
          <div class="form-group mb-0">
            <button type="submit" class="btn btn-primary btn-block">Send OTP</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <p class="text-center mt-4"><a href="{% url 'signin' %}">Back to Sign in</a></p>
  <br><br>
</section>

{% include "accounts/_auth_styles.html" %}

{% endblock navbar %}
